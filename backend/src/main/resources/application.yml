spring:
  application:
    name: edugestao
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edugestao}
    username: ${DB_USER:edugestao}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

edugestao:
  jwt:
    secret: ${JWT_SECRET}
    expiracao-horas: 8
  cors:
    origens-permitidas: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

---
# RNF-02: Perfil de producao com TLS/HTTPS habilitado
spring:
  config:
    activate:
      on-profile: prod
server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH:classpath:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
